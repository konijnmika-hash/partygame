# Publishes the browser-hosted version of Bloop Bash to GitHub Pages
# (https://<user>.github.io/<repo>/). Rooms run in the host player's browser and friends connect
# over WebRTC, so no game server is needed.
# The Puls app is published alongside it at https://<user>.github.io/<repo>/puls/ (https, so the
# phone camera for the barcode scanner works and the app can be installed on the home screen).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            puls/package-lock.json
      - run: npm ci
      - run: npm run build:pages
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Build Puls into /puls/
        working-directory: puls
        run: |
          npm ci
          npm run build -- --outDir ../dist/pages/puls --emptyOutDir
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
